name: Release

# Push a tag matching package.json's version (for example `v1.2.0`) to build
# every platform and publish a GitHub release. Installed copies of GitDesk
# pick it up through electron-updater (it reads latest*.yml from the release).
#
# Nothing is drafted, built or published unless formatting, typecheck, lint and the unit
# tests pass on the tagged commit, on every OS (the verify job).
#
# Least privilege: the jobs that install dependencies and build (and so run third-party
# install scripts) only get a read-only token, and the macOS signing secrets only reach the
# step that packages, signs and notarizes. Only the publish job, which runs no project code,
# can write to the release; the winget job after it gets no GITHUB_TOKEN permission at all.
# Actions are pinned to commit SHAs (Dependabot updates them).
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Seconds, before the much longer checks: a mistyped tag fails here.
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  verify:
    name: Verify (${{ matrix.os }})
    needs: version
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Same setup as ci.yml: LF line endings, and an identity for the tests' git commits.
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global user.name "GitDesk CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  draft:
    name: Create draft release
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # One draft up front; the publish job attaches every platform's files to it. A re-run
      # reuses the draft, but never touches a published release: its files and checksums
      # never change (a fix is a new version).
      # No checkout (no project code in a job that can write): gh is told the repository.
      - name: Create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft -q .isDraft 2>/dev/null || true)
          if [ "$draft" = false ]; then
            echo "::error::$GITHUB_REF_NAME is already published; a published release never changes (tag a new version)."
            exit 1
          fi
          if [ "$draft" != true ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "GitDesk $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  # Windows and Linux; macOS is the build-mac job below (it signs).
  build:
    name: Build (${{ matrix.os }})
    needs: [verify, draft]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No token here: electron-builder only writes the installers and latest*.yml to dist/.
      - name: Build
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # No Windows code-signing certificate yet: build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 3

  # Signed with the Developer ID certificate and notarized by Apple when the `mac-signing`
  # environment (v* tags only, no reviewers) holds the secrets; unsigned otherwise. They only
  # reach the packaging step: not `npm ci`, nor the app's own build.
  build-mac:
    name: Build (macos-latest)
    needs: [verify, draft]
    runs-on: macos-latest
    environment: mac-signing
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the app
        run: npm run build

      # electron-builder imports the certificate into a temporary keychain, signs with the
      # hardened runtime, then waits for Apple's notarization and staples it to the app.
      # A signed app that is not notarized is still blocked by macOS: no half-way build.
      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No MAC_CERTIFICATE in the mac-signing environment: the macOS build is unsigned."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never
            exit 0
          fi
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::MAC_CERTIFICATE is set, but not all of APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER: macOS would block a signed app that is not notarized."
            exit 1
          fi
          # electron-builder wants the path of Apple's .p8 key file.
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          APPLE_API_KEY="$key" npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-macos-latest
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    needs: [verify, build, build-mac]
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings → Environments) to approve each release.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Again here, after the approval: only a draft gets files (a re-run of an old tag, or a
      # release published by hand meanwhile, stops before anything is attested or uploaded).
      - name: Check the release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft -q .isDraft)
          if [ "$draft" != true ]; then
            echo "::error::$GITHUB_REF_NAME is not a draft release; a published release never changes (tag a new version)."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .

      # Build provenance: `gh attestation verify <file> --repo TheliosGroupe/GitDesk` checks a download.
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*

      - name: Upload to the draft and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # Submits the published version to winget (Windows Package Manager): a pull request to
  # microsoft/winget-pkgs, from the token owner's fork, that winget's moderators then merge.
  # Microsoft's wingetcreate does it, pinned by hash (change both when moving to a newer one).
  # The token comes from the `winget` environment (v* tags only, no reviewers: publish was
  # approved already). A failure here (no token, winget not reachable, GitDesk not in winget
  # yet) leaves the release as it is: submit that version by hand.
  winget:
    name: Submit to winget
    needs: publish
    runs-on: windows-latest
    environment: winget
    permissions: {}
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Download wingetcreate
        shell: pwsh
        run: |
          $url = 'https://github.com/microsoft/winget-create/releases/download/v1.28.1.0/wingetcreate.exe'
          $sha256 = '63d980ba79e97042395bd6eb5992c2db9e01e9e7a8a22958a95c288f27310413'
          Invoke-WebRequest $url -OutFile wingetcreate.exe
          if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash -ne $sha256) {
            throw 'wingetcreate.exe does not match its expected SHA-256'
          }

      # wingetcreate reads the token from this variable: it never appears on a command line.
      - name: Submit the new version
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Output '::warning::No WINGET_TOKEN secret in the winget environment: submit this version to winget by hand.'
            exit 0
          }
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $releases = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          .\wingetcreate.exe update Thelios.GitDesk `
            --version $version `
            --urls "$releases/download/$tag/gitdesk-$version-setup.exe" `
            --release-notes-url "$releases/tag/$tag" `
            --release-date (Get-Date -AsUTC -Format 'yyyy-MM-dd') `
            --submit
